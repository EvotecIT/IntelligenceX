name: Project Manifest

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "Build/Export-ProjectManifest.ps1"
      - "IntelligenceX/**/*.csproj"
      - "WebsiteArtifacts/project-manifest.json"

jobs:
  verify-manifest:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Generate Manifest
        shell: pwsh
        run: |
          ./Build/Export-ProjectManifest.ps1

      - name: Verify Manifest Is Committed
        shell: pwsh
        run: |
          git diff --exit-code -- WebsiteArtifacts/project-manifest.json

      - name: Upload Manifest Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: project-manifest
          path: WebsiteArtifacts/project-manifest.json
