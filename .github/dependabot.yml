version: 2
updates:
- package-ecosystem: nuget
  directory: /
  ignore:
  - dependency-name: System.DirectoryServices
    update-types:
    - version-update:semver-major
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
- package-ecosystem: github-actions
  directory: /
  ignore:
  - dependency-name: actions/*
    update-types:
    - version-update:semver-major
  - dependency-name: github/*
    update-types:
    - version-update:semver-major
  - dependency-name: codecov/codecov-action
    update-types:
    - version-update:semver-major
  - dependency-name: anthropics/claude-code-action
    update-types:
    - version-update:semver-major
  - dependency-name: dorny/paths-filter
    update-types:
    - version-update:semver-major
  schedule:
    interval: daily
  cooldown:
    default-days: 7
    include:
    - '*'
  open-pull-requests-limit: 1
  groups:
    all-dependencies:
      patterns:
      - '*'
